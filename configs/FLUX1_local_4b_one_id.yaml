schema_version: 2
name: FLUX1_local_4b_one_id
model:
  backend: flux
  arch: flux2_klein_4b
  weights: ${BA_ROOT}/weights/flux4b
  encoder: ${BA_ROOT}/weights/flux4b_text
  vae: ${BA_ROOT}/weights/flux_vae/ae.safetensors
  revision_lock: ${BA_ROOT}/locks/weights-small.json
data:
  train_manifest: ${BA_ROOT}/data/datasets/one_id/train.jsonl
  train_limit: 19
  validation_manifest: ${BA_ROOT}/data/datasets/one_id/validation_24_seeds01.jsonl
  target_size: [768, 768]
  reference_size: 512
  cache_dir: ${BA_ROOT}/cache/conditioning
branch:
  kind: masked_face_qkvo
  rank: 128
  alpha: 128
  gamma: 1.0
  query_chunk: 128
  max_reference_keys: 512
  mask_feather_pixels: 16
# Inactive generic-LoRA defaults; branch_only installs none of these adapters.
lora:
  rank: 8
  alpha: 8
training:
  steps: 2000
  grad_accum: 4
  lr: 0.00005
  warmup: 100
  checkpoint_every: 500
  validation_every: 500
  seed: 142
  deterministic: true
  gradient_checkpointing: true
  weight_decay: 0.0
  gradient_clip: 1.0
  max_reserved_fraction: 0.9
validation:
  steps: 20
  guidance: 4.0
  limit: 24
  batch_size: 1
hardware:
  min_vram_gb: 15
logging:
  comet_project: rsrch_new
  enabled: true
