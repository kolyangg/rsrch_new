schema_version: 2
name: flux9b_80_matched
model:
  backend: flux
  arch: flux2_klein_9b
  weights: ${BA_ROOT}/weights/flux9b
  encoder: ${BA_ROOT}/weights/flux9b_text
  vae: ${BA_ROOT}/weights/flux_vae/ae.safetensors
  revision_lock: ${BA_ROOT}/locks/weights-flux80.json
data:
  train_manifest: ${BA_ROOT}/data/train_pairs.jsonl
  train_limit: null
  validation_manifest: ${BA_ROOT}/data/validation/manual_val_96.jsonl
  target_size:
  - 768
  - 768
  reference_size: 512
  cache_dir: ${BA_ROOT}/cache/conditioning
branch:
  rank: 16
  alpha: 16
  gamma: 0.1
  query_chunk: 128
  max_reference_keys: 512
lora:
  rank: 8
  alpha: 8
training:
  steps: 2000
  grad_accum: 8
  lr: 0.0001
  warmup: 100
  checkpoint_every: 500
  validation_every: 2000
  seed: 42
  deterministic: true
  gradient_checkpointing: true
  weight_decay: 0.0
  gradient_clip: 1.0
  max_reserved_fraction: 0.9
validation:
  steps: 50
  guidance: 4.0
  limit: 96
hardware:
  min_vram_gb: 75
logging:
  comet_project: rsrch_new
  enabled: true
