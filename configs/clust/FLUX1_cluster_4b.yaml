# Historical 2-V100 setup: one training GPU and one frozen text encoder GPU.
# Superseded after TaskMaster cancellation; use docs/FLUX1_CLUSTER_DDP.md.
# Measured 100 updates at 3.619 s/update; fixed96 validation is unchanged.
schema_version: 2
name: FLUX1_cluster_4b
model:
  backend: flux
  arch: flux2_klein_4b
  weights: ${BA_ROOT}/weights/flux4b
  encoder: ${BA_ROOT}/weights/flux4b_text
  vae: ${BA_ROOT}/weights/flux_vae/ae.safetensors
  revision_lock: ${BA_ROOT}/locks/weights-small.json
  dtype: float32
  conditioning_dtype: float32
  compute_precision: amp_fp16_fp32_branch
data:
  conditioning: online
  train_manifest: ${BA_ROOT}/data/train_pairs_large_clust.jsonl
  train_limit: null
  validation_manifest: ${BA_ROOT}/data/validation/manual_val_96.jsonl
  target_size:
  - 768
  - 768
  reference_size: 512
  cache_dir: ${BA_ROOT}/cache/conditioning
  encoder_device: cuda:1
branch:
  kind: masked_face_qkvo
  rank: 128
  alpha: 128
  gamma: 1.0
  query_chunk: 128
  max_reference_keys: 512
  mask_feather_pixels: 16
lora:
  rank: 8
  alpha: 8
training:
  steps: 20000
  grad_accum: 1
  lr: 5.0e-05
  warmup: 100
  checkpoint_every: 500
  validation_every: 2000
  seed: 142
  deterministic: true
  gradient_checkpointing: true
  weight_decay: 0.0
  gradient_clip: 1.0
  max_reserved_fraction: 0.9
  world_size: 1
validation:
  steps: 20
  guidance: 4.0
  limit: 96
  batch_size: 1
hardware:
  min_vram_gb: 30
logging:
  comet_project: rsrch_new
  enabled: true
