[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-dit"
version = "0.1.0"
description = "CL39-inspired reference-read branch for FLUX.2 and Qwen-Image-2.1"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "safetensors>=0.6", "Pillow>=11", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["ba_dit*"]
